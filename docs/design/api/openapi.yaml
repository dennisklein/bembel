        - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/DhcpScope" } } } }
    EventPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Event" } } } }
    TokenPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Token" } } } }
    Token:
      type: object
      description: |
        A token narrows its owner by `permissions` and `scope`. It has no
        role; a role is only a template in the UI and the CLI. Lists and the
        audit log show `bem_pat_<id>_…`.
      required: [name, expires_at]
      properties:
        id: { type: string, readOnly: true, pattern: "^[A-Za-z0-9]{8}$", description: The public id., examples: [8Hq2vNf0] }
        name: { type: string, examples: [runbook-bot] }
        owner: { type: string, description: "Subject key of the owner. Only `POST /v1/tokens` sets it (a service subject of issuer `local`).", examples: ["svc:fw-pan-01"] }
        token: { type: string, readOnly: true, description: "Shown once: `bem_pat_<id>_<secret>`." }
        expires_at: { type: string, format: date-time }
        permissions: { type: array, items: { type: string }, examples: [["prefix:allocate", "address:allocate"]] }
        scope: { type: array, items: { $ref: "#/components/schemas/ScopeTerm" } }
        last_used_at: { type: [string, "null"], format: date-time, readOnly: true }
    Webhook:
      type: object
      required: [url, types]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        url: { type: string, format: uri }
        types: { type: array, items: { type: string }, examples: [["org.example.bembel.address.*"]] }
        secret: { type: string, readOnly: true, description: "HMAC key, `whsec_...`. Shown once." }
        enabled: { type: boolean }
        last_delivery_state: { type: string, readOnly: true, enum: [ok, retrying, failed] }
    Problem:
      type: object
      description: |
        RFC 9457 problem details with bembel members. The type is
        `urn:bembel:problem:<code>`. Codes of the allocation area:
        prefix.exhausted (409), address.conflict (409), address.observed (409),
        prefix.overlap (409), prefix.inside-subnet (409),
        prefix.subnet-has-children (409), claim.expired (409),
        idempotency.in-progress (409), idempotency.mismatch (422),
        request.invalid (400), validation.failed (422).
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, examples: ["urn:bembel:problem:prefix.exhausted"] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: Same as the end of `type`., examples: [prefix.exhausted] }
        request_id: { type: string }
        required_permission: { type: string, examples: ["prefix:allocate"] }
        holder: { type: object, additionalProperties: true, description: "address.conflict: the object that holds the address." }
        conflicting_prefix_id: { type: string, format: uuid, description: "prefix.overlap." }
        largest_free: { type: string, description: "prefix.exhausted: the largest free block." }
        utilisation: { type: number, description: "prefix.exhausted: used/usable × 100." }
        longest_free_run: { type: string, description: "prefix.exhausted with contiguous: the longest run of free addresses, as a decimal string." }
        expired_at: { type: string, format: date-time, description: "claim.expired." }
        errors:
          type: array
          items:
            type: object
            properties:
              pointer: { type: string, examples: ["/length"] }
              detail: { type: string }
    Event:
      type: object
      description: |
        CloudEvents 1.0, JSON format. The type is `org.example.bembel.` plus
        the event name. Prefix types: prefix.created, prefix.updated,
        prefix.deleted, prefix.allocated. Address types: address.claimed
        (allocate with `claim_ttl`), address.allocated (direct allocate,
        confirm with data `previous_status: claimed`, reactivation),
        address.deprecated (release with a grace above zero),
        address.released (the row is deleted; data `reason`: released,
        claim-expired, grace-over, subnet-leaked), address.updated (includes
        renew). Range types: range.created, range.updated, range.deleted.
        Access types include binding.suspended.
      required: [specversion, id, source, type]
      properties:
        specversion: { type: string, const: "1.0" }
        id: { type: string }
        source: { type: string, examples: ["https://bembel.example.org"] }
        type: { type: string, examples: [org.example.bembel.address.allocated] }
        subject: { type: string, examples: ["/v1/addresses/0197c3a2-5b7e-7c1d-9a40-3f6e2d81b5c4"] }
        time: { type: string, format: date-time }
        datacontenttype: { type: string, const: application/json }
        bembelseq: { type: integer, format: int64, description: "Gap-free, monotonic order number, assigned after commit. Resume with Last-Event-ID or after_seq loses nothing." }
        actor: { type: string }
        data: { type: object, additionalProperties: true }
