openapi: 3.1.0
info:
  title: bembel API
  version: 1.0.0-draft.1
  summary: REST API of bembel, the IPAM, DNS, DHCP and asset-view service.
  description: |
    Sketch of the contract. The real document is reviewed before any code.
    The web UI, the CLI and all integrations use only this API.

    Conventions:
    - Paths are plural and in kebab-case. Fields are in snake_case. Ids are UUIDv7.
    - Custom methods use a colon, for example `addresses:allocate` (AIP-136 style).
    - Errors use RFC 9457 `application/problem+json`.
    - Lists use cursor pagination (`page_size`, `page_token`).
    - Every resource has a strong `ETag`. Writes use `If-Match` (412 or 428).
    - Allocate and confirm calls need an `Idempotency-Key` header (24 h, 422 on a changed body).
    - Durations are ISO 8601, for example `PT10M`.
    - `kind` is only the object kind. The type of a prefix is `prefix_kind`, the type of a host is `host_kind`.
    - A claim is an address in status `claimed` with `expires_at`. There is no claim resource.

    Not yet in the sketch: /vlans, /vlan-domains, /fabrics, /ib-partitions, /views,
    /asns, /static-routes, /address-groups, /assets/*, /teams, /tags, /attributes,
    /sources, /operations, /drafts, /assistant/*, /imports, and the CRUD of
    /dns-servers, /dhcp-servers and /dhcp-failover-pairs (only their agent paths
    are in it). They follow the same conventions.

    Authentication: OpenID Connect. The web UI uses a BFF session (authorization
    code with PKCE). The CLI uses the device authorization grant (RFC 8628).
    Services send a JWT of a trusted issuer or a personal access token
    (`bem_pat_...`) as a bearer token.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: bembel design record
    url: https://github.com/dennisklein/bembel
servers:
  - url: https://bembel.example.org
    description: Production
  - url: http://localhost:8080
    description: Local development (bembel serve --dev)
security:
  - oidc: []
  - bearer: []
tags:
  - name: access
    description: Identity, permissions, roles, bindings, change requests, audit.
  - name: addressing
    description: VRF, prefix, address, range, VLAN.
  - name: hosts
    description: Hosts and interfaces.
  - name: dns
    description: Zones, views, records.
  - name: dhcp
    description: DHCP scopes and servers.
  - name: exports
    description: BIND, dhcpd, OpenSM, prefix lists and address-group feeds.
  - name: events
    description: Event list and SSE stream.
paths:
  /v1/me:
    get:
      tags: [access]
      operationId: getMe
      summary: Show the identity of the caller
      responses:
        "200": { description: "The caller.", content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/me/permissions:
    get:
      tags: [access]
      operationId: listMyPermissions
      summary: List the effective grants of the caller
      parameters:
        - name: permission
          in: query
          description: Only grants that include this permission, for example `prefix:allocate`.
          schema: { type: string, pattern: "^[a-z-]+:[a-z-]+$" }
      responses:
        "200":
          description: Effective grants, one row per binding.
          content:
            application/json:
              schema:
                type: object
                required: [grants]
                properties:
                  grants:
                    type: array
                    items: { $ref: "#/components/schemas/Grant" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/me/permissions:check:
    post:
      tags: [access]
      operationId: checkMyPermissions
      summary: Check a batch of actions for the caller
      description: |
        Uses the same predicate as the list queries. Max 100 checks per call.
        With `explain`, each result tells which bindings were tested and why
        they failed. With `subject`, the check runs for another subject. This
        needs `binding:read` in global scope, otherwise 403 `permission.denied`.
        CLI: `bembel access check [--explain] [--as SUBJECT] PERMISSION KIND/ID`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checks]
              properties:
                explain: { type: boolean, default: false }
                subject: { type: string, description: "Check for this subject key instead of the caller. Needs `binding:read` in global scope.", examples: ["kc:a.berger"] }
                checks:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [permission, resource]
                    properties:
                      permission: { type: string, examples: ["prefix:allocate"] }
                      resource:
                        type: object
                        required: [kind, id]
                        properties:
                          kind: { type: string, description: "Object kind, for example `prefix` or `change-request`." }
                          id: { type: string, format: uuid }
      responses:
        "200":
          description: One result for each check, in order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        allowed: { type: boolean }
                        via_binding: { type: [string, "null"], format: uuid }
                        explain:
                          type: object
                          description: Only with `explain`.
                          properties:
                            bindings:
                              type: array
                              items:
                                type: object
                                properties:
                                  binding_id: { type: string, format: uuid }
                                  via: { type: string, examples: ["kc:hpc-ops"] }
                                  role: { type: string }
                                  has_permission: { type: boolean }
                                  failed_term:
                                    oneOf:
                                      - $ref: "#/components/schemas/ScopeTerm"
                                      - type: "null"
                            held_by: { type: [string, "null"], description: "The four-eyes rule that holds the action.", examples: [prefix.delete-with-children] }
                            four_eyes: { type: [string, "null"], enum: [ok, self, null] }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/auth/config:
    get:
      tags: [access]
      operationId: getAuthConfig
      summary: Public login settings for the CLI
      security: []
      responses:
        "200":
          description: Issuer and public client id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer: { type: string, format: uri }
                  cli_client_id: { type: string, examples: [bembel-cli] }
                  audience: { type: string, examples: [bembel] }
  /v1/me/tokens:
    get:
      tags: [access]
      operationId: listMyTokens
      summary: List own personal access tokens (without secrets)
      responses:
        "200": { description: The tokens., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Token" } } } } }
    post:
      tags: [access]
      operationId: createMyToken
      summary: Create a personal access token
      description: |
        The secret shows once in the answer. bembel keeps only sha256(secret)
        and the public id. The token narrows the owner by `permissions` and
        `scope`. A role is only a template in the UI and the CLI (`--role`
        expands to `--permission`). A token never gets token, binding, role,
        draft:apply or change-request:approve permissions.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Token" } } }
      responses:
        "201": { description: Created. The `token` field holds `bem_pat_<id>_<secret>`., content: { application/json: { schema: { $ref: "#/components/schemas/Token" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/me/tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    delete:
      tags: [access]
      operationId: revokeMyToken
      summary: Revoke an own personal access token
      responses:
        "204": { description: Revoked. }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/tokens:
    get:
      tags: [access]
      operationId: listTokens
      summary: List the tokens of all subjects (token:admin)
      parameters:
        - { name: owner, in: query, description: Subject key of the owner, schema: { type: string } }
        - { name: owner_status, in: query, schema: { type: string, enum: [active, disabled] } }
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200": { description: The tokens (without secrets)., content: { application/json: { schema: { $ref: "#/components/schemas/TokenPage" } } } }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [access]
      operationId: createToken
      summary: Create a token for a local service subject (token:admin)
      description: |
        `owner` names a service subject of issuer `local`, for example
        `svc:fw-pan-01`. bembel creates the subject if it is new. The same
        denied list as for own tokens applies.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Token" } } }
      responses:
        "201": { description: Created. The `token` field holds `bem_pat_<id>_<secret>`., content: { application/json: { schema: { $ref: "#/components/schemas/Token" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    delete:
      tags: [access]
      operationId: revokeToken
      summary: Revoke the token of any subject (token:admin)
      responses:
        "204": { description: Revoked. }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/webhooks:
    get:
      tags: [events]
      operationId: listWebhooks
      summary: List webhook endpoints
      responses:
        "200": { description: The endpoints., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Webhook" } } } } }
    post:
      tags: [events]
      operationId: createWebhook
      summary: Register a webhook endpoint
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Webhook" } } }
      responses:
        "201": { description: Created. The signing secret shows once., content: { application/json: { schema: { $ref: "#/components/schemas/Webhook" } } } }
  /v1/roles:
    get:
      tags: [access]
      operationId: listRoles
      summary: List roles with their permissions
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200": { description: "A page of roles.", content: { application/json: { schema: { $ref: "#/components/schemas/RolePage" } } } }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [access]
      operationId: createRole
      summary: Create a custom role
      description: |
        Needs `role:create`. A role that holds a privileged permission needs a
        change request (rule `role.privileged`, 202). The privileged set is
        role:create, role:update, role:delete, binding:create, binding:delete,
        token:admin, source:update, audit:read and change-request:approve,
        tested after `*` is expanded.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Role" } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { $ref: "#/components/schemas/Role" } } } }
        "202": { $ref: "#/components/responses/Held" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/roles/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    put:
      tags: [access]
      operationId: replaceRole
      summary: Replace the permissions of a custom role
      description: |
        Needs `role:update`. A change that results in a privileged permission,
        and any change of a role with active bindings, needs a change request
        (rule `role.privileged`, 202). After the change, bembel tests each
        binding of the role against the current grants of its creator. A
        binding that fails gets `suspended_at`, grants nothing and emits
        `binding.suspended`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Role" } } }
      responses:
        "200": { description: "The changed role.", content: { application/json: { schema: { $ref: "#/components/schemas/Role" } } } }
        "202": { $ref: "#/components/responses/Held" }
        "403": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [access]
      operationId: deleteRole
      summary: Delete a custom role
      description: Needs `role:delete`. A role with active bindings needs a change request (rule `role.privileged`, 202).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204": { description: Deleted. }
        "202": { $ref: "#/components/responses/Held" }
        "403": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
  /v1/bindings:
    get:
      tags: [access]
      operationId: listBindings
      summary: List bindings
      parameters:
        - name: subject
          in: query
          description: Subject key, for example `kc:netops`.
          schema: { type: string }
        - name: role
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200": { description: "A page of bindings.", content: { application/json: { schema: { $ref: "#/components/schemas/BindingPage" } } } }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [access]
      operationId: createBinding
      summary: Create a binding
      description: |
        Needs `binding:create` in the scope of the new binding. The caller can
        grant only permissions that the caller holds, inside the scope of the
        caller. A binding whose role holds a privileged permission needs a
        change request (rule `binding.privileged`, 202). A binding of a role
        that holds `change-request:approve` to a service subject gives 422
        `binding.approver-service`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BindingInput" } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { $ref: "#/components/schemas/Binding" } } } }
        "202": { $ref: "#/components/responses/Held" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/bindings/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [access]
      operationId: deleteBinding
      summary: Delete a binding
      description: |
        Needs `binding:delete`. A binding whose role holds a privileged
        permission needs a change request (202). bembel refuses to delete the
        last active binding that gives binding:create, binding:delete and
        role:update in global scope (409 `binding.last-admin`).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204": { description: Deleted. }
        "202": { $ref: "#/components/responses/Held" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
  /v1/change-requests:
    get:
      tags: [access]
      operationId: listChangeRequests
      summary: List change requests
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [pending, approved, executed, failed, rejected, withdrawn, expired]
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200": { description: "A page of change requests.", content: { application/json: { schema: { $ref: "#/components/schemas/ChangeRequestPage" } } } }
  /v1/change-requests/{id}:
    parameters:
      - $ref: "#/components/parameters/ChangeRequestId"
    get:
      tags: [access]
      operationId: getChangeRequest
      summary: Get a change request
      description: Needs `change-request:read` on the target. The proposer can always read an own request.
      responses:
        "200": { description: "The change request.", content: { application/json: { schema: { $ref: "#/components/schemas/ChangeRequest" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/change-requests/{id}:approve:
    parameters:
      - $ref: "#/components/parameters/ChangeRequestId"
    post:
      tags: [access]
      operationId: approveChangeRequest
      summary: Approve and execute a change request
      description: |
        Needs `change-request:approve` on the target. The approver must be a
        human user (BFF session or OIDC user token), not the proposer, not a
        PAT or service token, and not a call from a draft apply.
        - 403 `change-request.self-approval`: the approver is the proposer.
        - 403 `change-request.approver-kind`: the caller is not a human user with a session or OIDC user token.
        - 403 `change-request.origin`: the call runs inside a draft apply or has origin `assistant`.

        bembel runs the held call in one transaction, as the proposer. It first
        tests the current grants of the proposer again (bindings, groups,
        expiry, suspension, disabled subject, PAT narrowing).
        - 409 `change-request.proposer-forbidden`: the grants no longer allow the action. The state becomes `failed` and nothing changes.
        - 409 `change-request.stale`: the target changed since the proposal. The state becomes `failed` and nothing changes.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string, maxLength: 1000 }
      responses:
        "200": { description: "The change ran. The body shows the final state.", content: { application/json: { schema: { $ref: "#/components/schemas/ChangeRequest" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/change-requests/{id}:reject:
    parameters:
      - $ref: "#/components/parameters/ChangeRequestId"
    post:
      tags: [access]
      operationId: rejectChangeRequest
      summary: Reject a change request
      description: |
        Needs `change-request:approve` on the target. The same approver rules
        as for `:approve` apply (403 `change-request.self-approval`,
        `change-request.approver-kind`, `change-request.origin`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200": { description: "Rejected.", content: { application/json: { schema: { $ref: "#/components/schemas/ChangeRequest" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/change-requests/{id}:withdraw:
    parameters:
      - $ref: "#/components/parameters/ChangeRequestId"
    post:
      tags: [access]
      operationId: withdrawChangeRequest
      summary: Withdraw an own pending change request
      description: Only the proposer can withdraw. 403 for any other subject.
      responses:
        "200": { description: "Withdrawn.", content: { application/json: { schema: { $ref: "#/components/schemas/ChangeRequest" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/change-requests/{id}/comments:
    parameters:
      - $ref: "#/components/parameters/ChangeRequestId"
    get:
      tags: [access]
      operationId: listChangeRequestComments
      summary: List the comments of a change request
      responses:
        "200":
          description: The comments, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Comment" } }
    post:
      tags: [access]
      operationId: addChangeRequestComment
      summary: Add a comment to a change request
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Comment" } } }
      responses:
        "201": { description: "Added.", content: { application/json: { schema: { $ref: "#/components/schemas/Comment" } } } }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/change-requests/{id}/impact:
    parameters:
      - $ref: "#/components/parameters/ChangeRequestId"
    get:
      tags: [access]
      operationId: getChangeRequestImpact
      summary: Show the impact of a change request now
      description: Computed on each read from the current data, for example the child prefixes and addresses under a prefix.
      responses:
        "200":
          description: The impact.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                examples: [{ prefixes: 4, addresses: 0 }]
  /v1/audit-events:
    get:
      tags: [access]
      operationId: listAuditEvents
      summary: Query the audit log
      description: |
        With `audit:read` in global scope, every event and every filter.
        Without it, only `allow` and `pending` events of objects that the
        caller can read now (`<resource_kind>:read` on the current row;
        deleted objects are not returned). `decision=deny` or an `actor` other
        than the caller then gives 403.
      parameters:
        - { name: actor, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: decision, in: query, schema: { type: string, enum: [allow, deny, pending] } }
        - { name: origin, in: query, schema: { type: string, enum: [ui, cli, api, assistant, agent, sync, system] } }
        - { name: resource_kind, in: query, schema: { type: string, examples: [address] } }
        - { name: resource_id, in: query, schema: { type: string, format: uuid } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200": { description: "A page of audit events.", content: { application/json: { schema: { $ref: "#/components/schemas/AuditEventPage" } } } }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/audit-events/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [access]
      operationId: getAuditEvent
      summary: Get one audit event
      description: The same visibility rules as for the list apply.
      responses:
        "200": { description: "The event.", content: { application/json: { schema: { $ref: "#/components/schemas/AuditEvent" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/vrfs:
    get:
      tags: [addressing]
      operationId: listVrfs
      summary: List VRFs
      parameters:
        - { name: name, in: query, schema: { type: string } }
        - { name: owner, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200": { description: "A page of VRFs.", content: { application/json: { schema: { $ref: "#/components/schemas/VrfPage" } } } }
    post:
      tags: [addressing]
      operationId: createVrf
      summary: Create a VRF
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VrfInput" } } }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { schema: { type: string, format: uri-reference } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Vrf" } } }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/vrfs/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [addressing]
      operationId: getVrf
      summary: Get a VRF
      responses:
        "200": { description: "The VRF.", headers: { ETag: { $ref: "#/components/headers/ETag" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Vrf" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [addressing]
      operationId: updateVrf
      summary: Change a VRF (JSON Merge Patch)
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content: { application/merge-patch+json: { schema: { $ref: "#/components/schemas/VrfInput" } } }
      responses:
        "200": { description: "The changed VRF.", content: { application/json: { schema: { $ref: "#/components/schemas/Vrf" } } } }
        "412": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/prefixes:
    get:
      tags: [addressing]
      operationId: listPrefixes
      summary: List prefixes
      description: |
        Filters combine with AND. A comma in one value means OR.
        `contains` returns the prefixes that contain an address or a prefix.
        `within` returns the prefixes under a CIDR (all depths).
      parameters:
        - { name: vrf, in: query, description: VRF name or id, schema: { type: string } }
        - { name: contains, in: query, schema: { type: string }, example: 10.20.4.44 }
        - { name: within, in: query, schema: { type: string, format: cidr }, example: 10.20.0.0/16 }
        - { name: prefix_kind, in: query, schema: { type: string, enum: [container, subnet] } }
        - { name: status, in: query, schema: { type: string }, example: "active,reserved" }
        - { name: fabric, in: query, schema: { type: string } }
        - { name: team, in: query, schema: { type: string } }
        - { name: external_ref, in: query, schema: { type: string } }
        - name: tag
          in: query
          description: "`key=value`; a bare key matches any value. Send `role=login` or `role%3Dlogin`. Repeat the parameter to AND tags."
          schema: { type: array, items: { type: string, pattern: "^[a-z0-9._-]+(=.*)?$" } }
          style: form
          explode: true
        - { name: q, in: query, description: Text search, schema: { type: string } }
        - { name: order_by, in: query, schema: { type: string, default: cidr } }
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200": { description: "A page of prefixes.", content: { application/json: { schema: { $ref: "#/components/schemas/PrefixPage" } } } }
        "400": { $ref: "#/components/responses/Problem" }
    post:
      tags: [addressing]
      operationId: createPrefix
      summary: Create a prefix
      description: |
        Needs `prefix:create`. bembel sets `parent_id` and `level`.
        - 409 `prefix.overlap` (member `conflicting_prefix_id`): the CIDR exists in the VRF.
        - 409 `prefix.inside-subnet`: the smallest containing prefix is a subnet.
        - 409 `prefix.subnet-has-children`: a new subnet over existing prefixes.
        - 422 `validation.failed`: host bits are set, or both `vlan_id` and `ib_partition_id` are given.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PrefixInput" } } }
      responses:
        "201": { description: "Created.", headers: { ETag: { $ref: "#/components/headers/ETag" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Prefix" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/prefixes/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [addressing]
      operationId: getPrefix
      summary: Get a prefix
      responses:
        "200": { description: "The prefix.", headers: { ETag: { $ref: "#/components/headers/ETag" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Prefix" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [addressing]
      operationId: updatePrefix
      summary: Change a prefix (JSON Merge Patch)
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content: { application/merge-patch+json: { schema: { $ref: "#/components/schemas/PrefixInput" } } }
      responses:
        "200": { description: "The changed prefix.", content: { application/json: { schema: { $ref: "#/components/schemas/Prefix" } } } }
        "412": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [addressing]
      operationId: deletePrefix
      summary: Delete a prefix
      description: A prefix with children needs a change request (202).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204": { description: Deleted. }
        "202": { $ref: "#/components/responses/Held" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/prefixes/{id}/free:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [addressing]
      operationId: listFreeRanges
      summary: Preview the free ranges of a prefix
      description: A preview only. It is not a reservation. Use `:allocate` to take an address.
      parameters:
        - { name: length, in: query, description: Show free child prefixes of this length, schema: { type: integer, minimum: 1, maximum: 128 } }
      responses:
        "200":
          description: Free ranges.
          content:
            application/json:
              schema:
                type: object
                properties:
                  free:
                    type: array
                    items:
                      type: object
                      properties:
                        first: { type: string }
                        last: { type: string }
                        count: { type: string, description: "Decimal string, because IPv6 counts exceed 64 bits." }
  /v1/prefixes/{id}/addresses:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [addressing]
      operationId: listPrefixAddresses
      summary: List the addresses of a subnet
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200": { description: "A page of addresses.", content: { application/json: { schema: { $ref: "#/components/schemas/AddressPage" } } } }
  /v1/prefixes/{id}/addresses:allocate:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [addressing]
      operationId: allocateAddress
      summary: Allocate the next free address, or claim it
      description: |
        The server chooses the address. Race-free: the database arbitrates.
        Give `address` to take one specific address (409 `address.conflict`
        with the member `holder` if taken).

        Without `claim_ttl` the address is `allocated` (or `reserved` with
        `status: reserved`). This needs `address:allocate`.
        With `claim_ttl` the address is `claimed` until `expires_at`. This
        needs `claim:create`. The caller confirms it with
        `POST /v1/addresses/{id}:confirm`, or the reaper deletes it after the
        expiry. Only addresses are claimed; prefixes never are.

        With `external_ref`, bembel first looks for an address of the same
        source and ref (adoption):
        - allocated or claimed in this prefix: 200, unchanged;
        - deprecated: 200, it becomes allocated (or claimed with `claim_ttl`) again;
        - in another prefix: 409 `address.conflict` with `holder`.

        No free address: 409 `prefix.exhausted` (members `largest_free`, `utilisation`).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AllocateAddress" } } }
      responses:
        "201":
          description: Allocated, reserved or claimed.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { schema: { type: string, format: uri-reference } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Address" } } }
        "200":
          description: Adopted. An address with this `external_ref` exists in this prefix.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Address" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/prefixes/{id}/addresses:batchAllocate:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [addressing]
      operationId: batchAllocateAddresses
      summary: Allocate or claim several addresses in one call
      description: |
        All or nothing, in one transaction. The permission is the same as for
        a single call. No room: 409 `prefix.exhausted`; with `contiguous` the
        problem has the extra member `longest_free_run`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BatchAllocateAddresses" } } }
      responses:
        "201":
          description: The new addresses, in address order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Address" } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/prefixes/{id}/prefixes:allocate:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [addressing]
      operationId: allocatePrefix
      summary: Allocate a child prefix from a pool
      description: |
        The parent must be a container marked as pool. Needs `prefix:allocate`.
        A prefix is never claimed. With `external_ref`, an existing prefix of
        the same source and ref comes back with 200.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [length, name]
              properties:
                length: { type: integer, minimum: 1, maximum: 128, examples: [26] }
                name: { type: string }
                prefix_kind: { type: string, enum: [container, subnet], default: subnet }
                status: { type: string, enum: [planned, active, reserved], default: planned }
                owner: { type: string, description: Team name. }
                external_ref: { type: string, description: "Durable natural key, unique per source.", examples: ["os-prod:subnet:5b1f6c0e-8d2a-4c7e-9f31-2a4d6e8b0c11"] }
                tags: { $ref: "#/components/schemas/Tags" }
      responses:
        "201": { description: "Allocated.", content: { application/json: { schema: { $ref: "#/components/schemas/Prefix" } } } }
        "200": { description: "Adopted by `external_ref`.", content: { application/json: { schema: { $ref: "#/components/schemas/Prefix" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/prefixes/{id}/ranges:allocate:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [addressing]
      operationId: allocateRange
      summary: Reserve an aligned block of addresses as a range
      description: |
        For load-balancer pools and other blocks inside a subnet. bembel takes
        the lowest free aligned block of `size` addresses (outside every
        address row, the gateway and every range), or exactly `hint` if that
        block is free. Otherwise 409 `prefix.exhausted`. Needs
        `prefix:allocate`. Deleting the range needs `range:delete`. Event
        `range.created`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AllocateRange" } } }
      responses:
        "201": { description: "Reserved.", content: { application/json: { schema: { $ref: "#/components/schemas/Range" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/ranges:
    get:
      tags: [addressing]
      operationId: listRanges
      summary: List ranges
      parameters:
        - { name: prefix_id, in: query, schema: { type: string, format: uuid } }
        - { name: purpose, in: query, schema: { type: string, enum: [dhcp-pool, reserved, static, infrastructure, lb-pool] } }
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200": { description: "A page of ranges.", content: { application/json: { schema: { $ref: "#/components/schemas/RangePage" } } } }
    post:
      tags: [addressing]
      operationId: createRange
      summary: Create a range with explicit bounds
      description: Needs `range:create` in the subnet. The range must lie inside one subnet and must not overlap another range.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Range" } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { $ref: "#/components/schemas/Range" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/ranges/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [addressing]
      operationId: getRange
      summary: Get a range
      responses:
        "200": { description: "The range.", headers: { ETag: { $ref: "#/components/headers/ETag" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Range" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [addressing]
      operationId: updateRange
      summary: Change a range (JSON Merge Patch)
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content: { application/merge-patch+json: { schema: { $ref: "#/components/schemas/Range" } } }
      responses:
        "200": { description: "The changed range.", content: { application/json: { schema: { $ref: "#/components/schemas/Range" } } } }
        "412": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [addressing]
      operationId: deleteRange
      summary: Delete a range
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204": { description: Deleted. }
        "412": { $ref: "#/components/responses/Problem" }
  /v1/addresses:
    get:
      tags: [addressing]
      operationId: listAddresses
      summary: List addresses across prefixes
      description: "`status=claimed` lists the open claims (CLI `bembel address ls --status claimed`)."
      parameters:
        - { name: vrf, in: query, schema: { type: string } }
        - { name: prefix_id, in: query, schema: { type: string, format: uuid } }
        - { name: address, in: query, schema: { type: string } }
        - { name: within, in: query, schema: { type: string, format: cidr } }
        - { name: mac, in: query, schema: { type: string } }
        - { name: fqdn, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [allocated, reserved, claimed, deprecated] } }
        - { name: observed, in: query, schema: { type: boolean } }
        - { name: external_ref, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200": { description: "A page of addresses.", content: { application/json: { schema: { $ref: "#/components/schemas/AddressPage" } } } }
  /v1/addresses/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [addressing]
      operationId: getAddress
      summary: Get an address
      responses:
        "200": { description: "The address.", headers: { ETag: { $ref: "#/components/headers/ETag" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Address" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [addressing]
      operationId: updateAddress
      summary: Change an address (name, interfaces, tags)
      description: |
        `interface_ids` may hold more than one id only when `shared` is true,
        otherwise 422 `validation.failed`. `external_ref` cannot change (422).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content: { application/merge-patch+json: { schema: { $ref: "#/components/schemas/Address" } } }
      responses:
        "200": { description: "The changed address.", content: { application/json: { schema: { $ref: "#/components/schemas/Address" } } } }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/addresses/{id}:confirm:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [addressing]
      operationId: confirmAddress
      summary: Confirm a claimed address
      description: |
        Needs `claim:confirm`. The address becomes `allocated` (event
        `address.allocated` with `previous_status: claimed`). An address that
        is already allocated gives 200 with no change. An expired claim gives
        409 `claim.expired` with the member `expired_at`. An unknown id gives 404.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Send `interface_id` or `interface`, not both (422).
              not: { required: [interface_id, interface] }
              properties:
                fqdn: { type: string }
                interface_id: { type: string, format: uuid }
                interface: { $ref: "#/components/schemas/InterfaceRef" }
                external_ref: { type: string }
                reservation: { type: boolean, description: Also write a DHCP reservation (needs a MAC). }
      responses:
        "200": { description: "The allocated address.", content: { application/json: { schema: { $ref: "#/components/schemas/Address" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/addresses/{id}:renew:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [addressing]
      operationId: renewAddress
      summary: Extend a claim
      description: |
        Needs `claim:create`. The new `expires_at` is now + `claim_ttl`. A
        total life over `allocation.max_claim_ttl` (24 hours) gives 422
        `validation.failed`. An expired claim gives 409 `claim.expired`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claim_ttl]
              properties:
                claim_ttl: { type: string, format: duration, examples: [PT10M] }
      responses:
        "200": { description: "The claim with the new expiry.", content: { application/json: { schema: { $ref: "#/components/schemas/Address" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/addresses/{id}:release:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [addressing]
      operationId: releaseAddress
      summary: Release an address or give up a claim
      description: |
        An allocated or reserved address becomes deprecated for the grace
        time, then the reaper frees it. Its DNS records and DHCP reservation
        leave the export when it becomes deprecated. A claimed address is
        deleted at once. An omitted `grace` uses
        `allocation.default_release_grace` (P7D). `PT0S` frees the address at
        once (the CLI asks for a confirmation for `--now`).

        Needs `address:release`, or `claim:release` for a claimed address.
        An observed address that its source still reports gives 409
        `address.observed`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                grace: { type: string, format: duration, default: P7D, examples: [P7D, PT1H, PT0S] }
      responses:
        "200": { description: "Deprecated until `deprecated_until`.", content: { application/json: { schema: { $ref: "#/components/schemas/Address" } } } }
        "204": { description: "The row is deleted: a claim, or `grace` PT0S. Event `address.released`." }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
  /v1/hosts:
    get:
      tags: [hosts]
      operationId: listHosts
      summary: List hosts
      parameters:
        - { name: host_kind, in: query, schema: { type: string, enum: [physical, vm, hypervisor, appliance, container-node] } }
        - { name: runs_on, in: query, description: Host name of a hypervisor, schema: { type: string } }
        - { name: platform, in: query, schema: { type: string, enum: [libvirt, openstack, other] } }
        - { name: team, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200": { description: "A page of hosts.", content: { application/json: { schema: { $ref: "#/components/schemas/HostPage" } } } }
    post:
      tags: [hosts]
      operationId: createHost
      summary: Create a host
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Host" } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { $ref: "#/components/schemas/Host" } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/hosts/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [hosts]
      operationId: getHost
      summary: Get a host with its interfaces
      responses:
        "200": { description: "The host.", headers: { ETag: { $ref: "#/components/headers/ETag" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Host" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/interfaces:
    get:
      tags: [hosts]
      operationId: listInterfaces
      summary: List interfaces
      parameters:
        - { name: mac, in: query, schema: { type: string } }
        - { name: port_guid, in: query, description: "InfiniBand port GUID, 16 hex digits. Colons and `0x` are accepted.", schema: { type: string }, example: "0c42a1030071a2b4" }
        - { name: host, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200": { description: "A page of interfaces.", content: { application/json: { schema: { $ref: "#/components/schemas/InterfacePage" } } } }
  /v1/zones:
    get:
      tags: [dns]
      operationId: listZones
      summary: List zones
      parameters:
        - { name: view, in: query, schema: { type: string } }
        - { name: under, in: query, description: "Zone subtree, for example `example.org`", schema: { type: string } }
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200": { description: "A page of zones.", content: { application/json: { schema: { $ref: "#/components/schemas/ZonePage" } } } }
  /v1/zones/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [dns]
      operationId: getZone
      summary: Get a zone
      responses:
        "200": { description: "The zone.", content: { application/json: { schema: { $ref: "#/components/schemas/Zone" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [dns]
      operationId: deleteZone
      summary: Delete a zone
      description: Always needs a change request (202).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "202": { $ref: "#/components/responses/Held" }
        "204": { description: Deleted by an approved change request. }
  /v1/zones/{id}/records:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [dns]
      operationId: listRecords
      summary: List the records of a zone
      parameters:
        - { name: type, in: query, schema: { type: string, examples: [CNAME] } }
        - { name: name, in: query, schema: { type: string } }
        - { name: derived, in: query, schema: { type: boolean } }
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200": { description: "A page of records.", content: { application/json: { schema: { $ref: "#/components/schemas/RecordPage" } } } }
    post:
      tags: [dns]
      operationId: createRecord
      summary: Create a manual record
      description: Derived records (A, AAAA, PTR) come from addresses. 409 `record.derived` if you try to write one.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Record" } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { $ref: "#/components/schemas/Record" } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/dhcp-scopes:
    get:
      tags: [dhcp]
      operationId: listDhcpScopes
      summary: List DHCP scopes
      parameters:
        - { name: server, in: query, schema: { type: string } }
        - { name: prefix_id, in: query, schema: { type: string, format: uuid } }
        - { name: enabled, in: query, schema: { type: boolean } }
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200": { description: "A page of DHCP scopes.", content: { application/json: { schema: { $ref: "#/components/schemas/DhcpScopePage" } } } }
    post:
      tags: [dhcp]
      operationId: createDhcpScope
      summary: Create a DHCP scope for a subnet
      description: |
        Needs `dhcp-scope:create` in the subnet. dhcpd has one flat address
        space, so one server, and both peers of a pair, must not serve
        overlapping subnets from different VRFs: 409 `dhcp-scope.vrf-overlap`
        names both scopes and both VRFs.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DhcpScope" } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { $ref: "#/components/schemas/DhcpScope" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/dhcp-scopes/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [dhcp]
      operationId: getDhcpScope
      summary: Get a DHCP scope
      responses:
        "200": { description: "The scope.", headers: { ETag: { $ref: "#/components/headers/ETag" } }, content: { application/json: { schema: { $ref: "#/components/schemas/DhcpScope" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [dhcp]
      operationId: updateDhcpScope
      summary: Change a DHCP scope
      description: Needs `dhcp-scope:update`. A change of `servers` or `failover_pair` runs the VRF overlap test again (409 `dhcp-scope.vrf-overlap`).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content: { application/merge-patch+json: { schema: { $ref: "#/components/schemas/DhcpScope" } } }
      responses:
        "200": { description: "The changed scope.", content: { application/json: { schema: { $ref: "#/components/schemas/DhcpScope" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
  /v1/dns-servers/{name}/bundle:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      tags: [exports]
      operationId: getDnsServerBundle
      summary: Pull the signed bundle of a DNS server (agent)
      description: |
        The answer is a tar with three parts: `bundle.tar`, `manifest.json`
        and `manifest.json.sig` (Ed25519 over manifest.json). The manifest
        names `format`, `kind` (bind), `server`, `snapshot`, `created_at`,
        `key_id`, `bundle_sha256` and the sha256 of each file. The agent
        trusts only the signed manifest. It checks the signature, then that
        `kind` and `server` are its own, then that `snapshot` is not lower
        than that of its current release, then the hashes.
      parameters:
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        "200": { description: "The bundle.", headers: { ETag: { $ref: "#/components/headers/ETag" } }, content: { application/x-tar: { schema: { type: string, format: binary } } } }
        "304": { description: Not modified. }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/dns-servers/{name}/deployments:
    parameters:
      - $ref: "#/components/parameters/Name"
    post:
      tags: [exports]
      operationId: reportDnsDeployment
      summary: Report the result of a deployment (agent)
      description: A local `bembel-agent rollback` reports the serials it stamped here. bembel then raises its stored serial for each zone.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Deployment" } } }
      responses:
        "204": { description: Stored. }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/dns-servers/{name}/pin:
    parameters:
      - $ref: "#/components/parameters/Name"
    put:
      tags: [exports]
      operationId: pinDnsServer
      summary: Hold a DNS server on the content of a known good bundle
      description: |
        Needs `export:build`. A pin rolls forward: bembel builds a new bundle
        (new id, new snapshot, new ETag) with the zone bodies of the named
        bundle. Each zone whose body differs gets the serial max(highest
        serial that bembel published for that zone and view, highest served
        serial) + 1. The bundle runs the normal checks. While the pin holds,
        data changes do not change the bundle of this server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundle, reason]
              properties:
                bundle: { type: string, pattern: "^b-[0-9a-f]{6}$", examples: [b-5e08c3] }
                reason: { type: string }
      responses:
        "200":
          description: Pinned. The body names the new roll-forward bundle.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bundle: { type: string, examples: [b-9d21a4] }
                  pinned_to: { type: string, examples: [b-5e08c3] }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [exports]
      operationId: unpinDnsServer
      summary: Lift the pin of a DNS server
      description: Needs `export:build`. The next export uses a serial above the stamped one.
      responses:
        "204": { description: The pin is lifted. }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/dhcp-servers/{name}/bundle:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      tags: [exports]
      operationId: getDhcpServerBundle
      summary: Pull the signed bundle of a DHCP server (agent)
      description: The same parts and checks as for a DNS server, with `kind` dhcpd.
      parameters:
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        "200": { description: "The bundle.", headers: { ETag: { $ref: "#/components/headers/ETag" } }, content: { application/x-tar: { schema: { type: string, format: binary } } } }
        "304": { description: Not modified. }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/dhcp-servers/{name}/deployments:
    parameters:
      - $ref: "#/components/parameters/Name"
    post:
      tags: [exports]
      operationId: reportDhcpDeployment
      summary: Report the result of a deployment (agent)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Deployment" } } }
      responses:
        "204": { description: Stored. }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/dhcp-servers/{name}/leases:
    parameters:
      - $ref: "#/components/parameters/Name"
    post:
      tags: [dhcp]
      operationId: reportDhcpLeases
      summary: Send leases and log observations (agent)
      description: |
        dhcpd.leases holds only pool addresses (`source: lease`). The agent
        also reads the dhcpd log: a DHCPACK gives last-seen data for a
        reservation (`kind: ack`), and an unknown client gives `kind:
        unmatched`. bembel resolves (server, ip) to scope, prefix, VRF and
        address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 5000
              items: { $ref: "#/components/schemas/LeaseObservation" }
      responses:
        "204": { description: Stored. }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/dhcp-failover-pairs/{name}/restart-tickets:
    parameters:
      - $ref: "#/components/parameters/Name"
    post:
      tags: [dhcp]
      operationId: requestRestartTicket
      summary: Ask for the right to restart one peer of a failover pair (agent)
      description: |
        bembel grants a ticket only if the agent of the other peer reported,
        less than PT2M ago, `local-state` and `partner-state` both `normal`
        (read over OMAPI) and the process active. A ticket expires after
        PT10M.
        - 409 `dhcp-failover.ticket-held`: the other peer holds a ticket.
        - 409 `dhcp-failover.peer-not-normal`: the other peer is not normal.

        With `override: true` the call is held (202, rule
        `dhcp.restart-override`). The approval screen shows the partner
        state, the MCLT and the impact. On approval bembel issues the ticket,
        with `expires_at` = execution + PT10M. This needs `dhcp-server:update`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server]
              properties:
                server: { type: string, examples: [dhcp2.example.org] }
                override: { type: boolean, default: false }
      responses:
        "201":
          description: Granted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  server: { type: string }
                  expires_at: { type: string, format: date-time }
        "202": { $ref: "#/components/responses/Held" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/dhcp-failover-pairs/{name}/restart-tickets/{id}:
    parameters:
      - $ref: "#/components/parameters/Name"
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [dhcp]
      operationId: returnRestartTicket
      summary: Give the ticket back after the restart (agent)
      responses:
        "204": { description: Returned. }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/exports:
    get:
      tags: [exports]
      operationId: listExports
      summary: List export targets
      responses:
        "200":
          description: Export targets with the state of the last build.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Export" }
  /v1/exports/{id}:build:
    parameters:
      - $ref: "#/components/parameters/ExportId"
    post:
      tags: [exports]
      operationId: buildExport
      summary: Build an export now
      description: Needs `export:build`.
      responses:
        "202": { description: "The build runs. Poll the export.", content: { application/json: { schema: { $ref: "#/components/schemas/Export" } } } }
  /v1/exports/{id}/artifact:
    parameters:
      - $ref: "#/components/parameters/ExportId"
    get:
      tags: [exports]
      operationId: getExportArtifact
      summary: Download or preview the current export
      description: |
        For a human download and preview, and for the prefix-list exports.
        DNS, DHCP and OpenSM agents never pull this; they use the signed
        per-server bundles. 304 when nothing changed.
      parameters:
        - { name: format, in: query, description: Prefix-list exports only., schema: { type: string, enum: [frr, bird, junos, eos] } }
        - { name: family, in: query, description: Prefix-list exports only., schema: { type: integer, enum: [4, 6] } }
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        "200": { description: "The files as tar.gz, or one file for single-file targets.", headers: { ETag: { $ref: "#/components/headers/ETag" } }, content: { application/gzip: { schema: { type: string, format: binary } }, text/plain: { schema: { type: string } } } }
        "304": { description: Not modified. }
  /v1/feeds/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      tags: [exports]
      operationId: getFeed
      summary: Get the current revision of an address-group feed
      description: |
        Needs `address-group:read` on the group. A firewall that cannot send
        a header uses the token variant `/v1/feeds/t/{token}/{name}?format=text`.
        A JSON feed has a top-level `vrf`.
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [nft, firewalld, text, json], default: text } }
        - { name: family, in: query, schema: { type: integer, enum: [4, 6] } }
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        "200":
          description: The feed.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            text/plain: { schema: { type: string } }
            application/json: { schema: { type: object, additionalProperties: true } }
        "304": { description: Not modified. }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/search:
    get:
      tags: [addressing]
      operationId: search
      summary: Search all objects
      description: |
        Exact parse first (IP, CIDR, MAC, GUID, FQDN, VLAN id), then full text,
        then vector similarity when the embedding service runs. Only objects
        that the caller can read appear.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: kind, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Hits in rank order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        id: { type: string, format: uuid }
                        title: { type: string }
                        match: { type: string, enum: [exact, text, vector] }
  /v1/events:
    get:
      tags: [events]
      operationId: listEvents
      summary: List events (CloudEvents, JSON)
      description: Only events that have a `bembelseq` appear, in `bembelseq` order. Resume with `after_seq`.
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: after_seq, in: query, schema: { type: integer, format: int64 } }
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200": { description: "A page of events.", content: { application/json: { schema: { $ref: "#/components/schemas/EventPage" } } } }
  /v1/events/stream:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Server-sent events
      description: |
        Resume with the `Last-Event-ID` header. The id is the event sequence
        number (`bembelseq`). A pod that shuts down sends `retry: 2000` and
        closes the stream; the client reconnects with `Last-Event-ID`.
      parameters:
        - { name: types, in: query, description: Comma list of type globs, schema: { type: string } }
        - { name: Last-Event-ID, in: header, schema: { type: string } }
      responses:
        "200": { description: "An open stream of `event: bembel` frames. The data is one CloudEvent.", content: { text/event-stream: { schema: { type: string } } } }
components:
  securitySchemes:
    oidc:
      type: oauth2
      description: |
        OpenID Connect at the issuer of the site, for example
        `https://id.example.org/realms/main`.
        Browser: authorization code with PKCE through the BFF (the browser
        holds only an HttpOnly session cookie). CLI: device authorization
        grant (RFC 8628). Services: client credentials, or a JWT of a trusted issuer.
      flows:
        authorizationCode:
          authorizationUrl: https://id.example.org/realms/main/protocol/openid-connect/auth
          tokenUrl: https://id.example.org/realms/main/protocol/openid-connect/token
          scopes:
            openid: Identity
            bembel: Use the API with the permissions of the user
        clientCredentials:
          tokenUrl: https://id.example.org/realms/main/protocol/openid-connect/token
          scopes:
            bembel: Use the API with the permissions of the service
    bearer:
      type: http
      scheme: bearer
      description: |
        A JWT of a trusted issuer (audience `bembel`) or a personal access
        token in the form `bem_pat_<id>_<secret>` (id: 8 characters
        [A-Za-z0-9]; secret: 32 random bytes, base64url without padding, 43
        characters).
        For a PAT of a user, bembel reads the state and the groups of the
        owner from the IdP at use time (cached at most PT5M):
        - 401 `auth.invalid-token`: the owner is disabled or deleted.
        - 503 `auth.directory-unavailable` with `Retry-After`: the IdP cannot be reached and the cache is older than PT5M.
  headers:
    ETag:
      description: Strong entity tag. Use it in `If-Match`.
      schema: { type: string, examples: ['"7"'] }
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Name:
      name: name
      in: path
      required: true
      description: The unique name of the object, for example `ns1.example.org`, `dhcp-a` or `login-nodes`.
      schema: { type: string }
    TokenId:
      name: id
      in: path
      required: true
      description: The public id of the token.
      schema: { type: string, pattern: "^[A-Za-z0-9]{8}$", examples: [8Hq2vNf0] }
    ChangeRequestId:
      name: id
      in: path
      required: true
      description: The number (`cr-0042`) or the uuid of the change request.
      schema: { type: string, examples: [cr-0042] }
    ExportId:
      name: id
      in: path
      required: true
      description: The id or the name of the export, for example `campus-bgp`.
      schema: { type: string }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    PageToken:
      name: page_token
      in: query
      description: Opaque cursor from `next_page_token`. Valid 24 h.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: &idempotency |
        Required on `addresses:allocate`, `addresses:batchAllocate`,
        `prefixes:allocate`, `ranges:allocate` and `addresses/{id}:confirm`;
        a missing key there gives 400 `request.invalid` (the detail names the
        header). Optional on every other POST, including `:release` and
        `:renew`. Length 8 to 255.
        bembel stores the answer per subject for 24 h, with a fingerprint
        (SHA-256 of method, path and canonical JSON body) and the ids of the
        objects that the call created.
        - Same key, same fingerprint, finished: the stored answer, with `Idempotent-Replayed: true`.
        - Same key, other fingerprint: 422 `idempotency.mismatch`.
        - First call still running: the call waits for it. A commit replays, a rollback runs as new. After `lock_timeout` (5 s): 409 `idempotency.in-progress` with `Retry-After: 1`.
        - First call failed with 4xx or 5xx: nothing is stored, the call runs again.
        - An object that the first call created has since been released, expired or deleted: the key went with it, the call runs again as new.
        - Older than 24 h: the call runs as new.
      schema: { type: string, minLength: 8, maxLength: 255 }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: *idempotency
      schema: { type: string, minLength: 8, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      description: The `ETag` of the resource. 412 if it changed, 428 if missing.
      schema: { type: string }
  responses:
    Problem:
      description: Error (RFC 9457).
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Held:
      description: |
        The action needs a second subject. A change request holds it. The
        rules are prefix.delete-with-children, zone.delete, bulk.threshold,
        binding.privileged, role.privileged and dhcp.restart-override.
        Send `Bembel-Change-Request: never` to get 409 `change-request.required` instead.
      headers:
        Location: { schema: { type: string, format: uri-reference } }
      content: { application/json: { schema: { $ref: "#/components/schemas/ChangeRequest" } } }
  schemas:
    Tags:
      type: object
      description: "Key and value labels. The text form is `key=value`; the key matches `[a-z0-9._-]+`."
      additionalProperties: { type: string }
      propertyNames: { pattern: "^[a-z0-9._-]+$" }
      examples: [{ role: login }]
    Meta:
      type: object
      description: Fields of every object. Read only, except `owner`, `tags`, `attributes`, and `external_ref` on create.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        kind: { type: string, readOnly: true, description: "The object kind.", examples: [prefix, address, host] }
        owner: { type: [string, "null"], description: Team name. }
        tags: { $ref: "#/components/schemas/Tags" }
        attributes: { type: object, additionalProperties: true }
        source: { type: string, readOnly: true, description: "Set by the server from the source of the subject.", examples: [local, "openstack:os-prod", "k8s:prod-1", "libvirt:hv-03", ona-import] }
        external_ref: { type: [string, "null"], description: "Set on create. A later change gives 422. Unique per source." }
        managed_by: { type: [string, "null"], readOnly: true, description: "Separates writers inside one source.", examples: [openstack-driver, ona-import] }
        created_at: { type: string, format: date-time, readOnly: true }
        created_by: { type: string, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
        updated_by: { type: string, readOnly: true }
        revision: { type: integer, format: int64, readOnly: true }
        allowed_actions:
          type: array
          readOnly: true
          description: Verbs the caller may use on this object. The server checks again on each call.
          items: { type: string }
    Vrf:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [name]
          properties:
            name: { type: string, examples: [hpc-fabric] }
            description: { type: string }
            route_distinguisher: { type: [string, "null"], description: "Null for global (the default table).", examples: ["64512:100"] }
            import_targets: { type: array, items: { type: string } }
            export_targets: { type: array, items: { type: string }, examples: [["65010:1"]] }
    VrfInput:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        owner: { type: [string, "null"] }
        route_distinguisher: { type: [string, "null"] }
        external_ref: { type: string }
        tags: { $ref: "#/components/schemas/Tags" }
    Prefix:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [cidr, vrf, prefix_kind, status]
          properties:
            cidr: { type: string, format: cidr, examples: [10.20.4.0/22, "2001:db8:4200:204::/64"] }
            vrf: { type: string, description: VRF name, examples: [global] }
            vrf_id: { type: string, format: uuid }
            parent_id: { type: [string, "null"], format: uuid, readOnly: true }
            level: { type: integer, readOnly: true, description: Number of prefixes in the VRF that contain this one. }
            prefix_kind: { type: string, enum: [container, subnet] }
            status: { type: string, enum: [planned, active, reserved, deprecated] }
            is_pool: { type: boolean, description: "Allocate child prefixes from here. Only a container." }
            name: { type: string, examples: [kestrel-compute] }
            description: { type: string }
            fabric: { type: [string, "null"], examples: [campus, kestrel-ib, osprey-roce] }
            vlan_id: { type: [string, "null"], format: uuid }
            vlan:
              type: [object, "null"]
              readOnly: true
              properties:
                domain: { type: string, examples: [campus-hall2] }
                vid: { type: integer, minimum: 1, maximum: 4094, examples: [204] }
                name: { type: string, examples: [kestrel-compute] }
            ib_partition_id: { type: [string, "null"], format: uuid }
            ib_partition:
              type: [object, "null"]
              readOnly: true
              properties:
                fabric: { type: string, examples: [kestrel-ib] }
                pkey: { type: string, pattern: "^0x[0-9a-f]{4}$", examples: ["0x0001"] }
                name: { type: string, examples: [kestrel-ipoib] }
            twin_id: { type: [string, "null"], format: uuid, description: "The subnet of the other family. The link is symmetric." }
            twin:
              type: [object, "null"]
              readOnly: true
              properties:
                cidr: { type: string, examples: ["2001:db8:4200:204::/64"] }
                vrf: { type: string, examples: [global] }
            dns_zone: { type: [string, "null"], description: Zone name., examples: [kestrel.example.org] }
            gateway: { type: [string, "null"], format: ip, description: "A host address inside the subnet.", examples: [10.20.4.1] }
            site: { type: [string, "null"] }
            announce: { type: boolean }
            utilisation:
              type: object
              readOnly: true
              properties:
                used: { type: string, description: "Decimal string. Address rows plus addresses in dhcp-pool, reserved, infrastructure and lb-pool ranges, each counted once." }
                size: { type: string, description: Decimal string of the usable addresses. }
                percent: { type: [number, "null"], description: "used/usable × 100; null for IPv6 subnets larger than a /112" }
    PrefixInput:
      type: object
      description: Send `vlan_id` or `ib_partition_id`, not both (422 `validation.failed`).
      not: { required: [vlan_id, ib_partition_id] }
      properties:
        cidr: { type: string, format: cidr }
        vrf: { type: string }
        prefix_kind: { type: string, enum: [container, subnet] }
        status: { type: string, enum: [planned, active, reserved, deprecated] }
        is_pool: { type: boolean }
        name: { type: string }
        description: { type: string }
        fabric: { type: [string, "null"] }
        vlan_id: { type: [string, "null"], format: uuid }
        ib_partition_id: { type: [string, "null"], format: uuid }
        twin_id: { type: [string, "null"], format: uuid }
        dns_zone: { type: [string, "null"] }
        gateway: { type: [string, "null"], format: ip }
        site: { type: [string, "null"] }
        owner: { type: [string, "null"] }
        external_ref: { type: string, description: "Set on create only." }
        tags: { $ref: "#/components/schemas/Tags" }
    Range:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [prefix_id, purpose, first_addr, last_addr]
          properties:
            prefix_id: { type: string, format: uuid, description: The subnet that holds the range. }
            name: { type: string, examples: [kestrel-lb-v4, os-pool-1] }
            purpose:
              type: string
              enum: [dhcp-pool, reserved, static, infrastructure, lb-pool]
              description: |
                Allocation without `range` skips dhcp-pool, reserved,
                infrastructure and lb-pool, and may use static.
            first_addr: { type: string, format: ip, examples: [10.20.66.0] }
            last_addr: { type: string, format: ip, examples: [10.20.66.63] }
            size: { type: string, readOnly: true, description: Decimal string., examples: ["64"] }
    AllocateRange:
      type: object
      required: [size, purpose, name]
      properties:
        size: { type: integer, minimum: 1, maximum: 65536, description: "A power of two.", examples: [64, 65536] }
        purpose: { type: string, enum: [dhcp-pool, reserved, static, infrastructure, lb-pool], examples: [lb-pool] }
        name: { type: string, examples: [kestrel-lb-v4] }
        hint: { type: string, format: ip, description: Take exactly this aligned block if it is free., examples: [10.20.66.0] }
        external_ref: { type: string, examples: ["k8s:kestrel-mgmt:lbpool/metallb-system/kestrel-lb/v4"] }
        tags: { $ref: "#/components/schemas/Tags" }
    Vlan:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [domain, vid]
          properties:
            domain: { type: string, examples: [campus-hall2] }
            vid: { type: integer, minimum: 1, maximum: 4094, examples: [204] }
            name: { type: string, examples: [kestrel-compute] }
    VlanDomain:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [name]
          properties:
            name: { type: string, examples: [campus-hall2] }
            site: { type: [string, "null"], examples: [Hall 2] }
    IbPartition:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [fabric, name, pkey]
          properties:
            fabric: { type: string, examples: [kestrel-ib] }
            name: { type: string, examples: [kestrel-ipoib] }
            pkey: { type: string, pattern: "^0x[0-9a-f]{4}$", description: "The 15-bit base key, 0x0001 to 0x7ffe (0x7fff is Default). Bit 15 is removed on input (0x8002 becomes 0x0002).", examples: ["0x0001"] }
            ipoib: { type: boolean }
            mtu: { type: integer, examples: [4096] }
            default_membership: { type: string, enum: [full, limited], description: "The membership that bembel gives a member added without an explicit one." }
    Address:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [address, status]
          properties:
            address: { type: string, format: ip, examples: [10.20.4.44] }
            prefix_id: { type: string, format: uuid }
            vrf: { type: string }
            status: { type: string, enum: [allocated, reserved, claimed, deprecated] }
            fqdn: { type: [string, "null"], examples: [cn-004.kestrel.example.org] }
            shared: { type: boolean, description: "A VIP, anycast or other address on more than one interface." }
            interface_ids:
              type: array
              description: More than one only with `shared` true, otherwise 422.
              items: { type: string, format: uuid }
            interfaces:
              type: array
              readOnly: true
              items:
                type: object
                properties:
                  interface_id: { type: string, format: uuid }
                  host: { type: string, examples: [cn-004.kestrel.example.org] }
                  name: { type: string, examples: [eno1] }
                  mac: { type: [string, "null"], examples: ["3c:ec:ef:12:0a:44"] }
            description: { type: string }
            expires_at: { type: [string, "null"], format: date-time, readOnly: true, description: Only for status claimed. }
            publish: { type: boolean, readOnly: true, description: "A claim with publish true makes its records and DHCP reservation." }
            deprecated_until: { type: [string, "null"], format: date-time, readOnly: true, description: Only for status deprecated. }
            observed: { type: boolean, readOnly: true }
            last_seen_at: { type: [string, "null"], format: date-time, readOnly: true }
            last_seen_source: { type: [string, "null"], readOnly: true, description: "Agent, sync or lease source." }
            derived_records:
              type: array
              readOnly: true
              items: { type: string, examples: ["A cn-004.kestrel.example.org", "PTR 44.4.20.10.in-addr.arpa"] }
    InterfaceRef:
      type: object
      description: Create or find the host and the interface in the same call.
      required: [host, name]
      properties:
        host: { type: string, examples: [cn-622.kestrel.example.org] }
        name: { type: string, examples: [eno1] }
        mac: { type: string, examples: ["3c:ec:ef:7a:10:22"] }
        port_guid: { type: string, description: "InfiniBand port GUID, 16 hex digits.", examples: ["0c42a1030071a2b4"] }
    AllocateOptions:
      type: object
      description: Fields that a single and a batch allocate share.
      not: { required: [interface_id, interface] }
      properties:
        strategy: { type: string, enum: [first, last, random, hint], default: first }
        on_conflict: { type: string, enum: [fail, next], default: fail }
        range:
          type: string
          description: |
            Range name or id. Allocate only inside this range. Allowed
            purposes: static, infrastructure, and reserved (needs
            `range:update`). Any other purpose gives 422.
        interface_id: { type: string, format: uuid, description: "Send `interface_id` or `interface`, not both (422)." }
        interface: { $ref: "#/components/schemas/InterfaceRef" }
        reservation: { type: boolean, description: Also write a DHCP reservation (needs the MAC). }
        claim_ttl:
          type: string
          format: duration
          description: |
            If set, the result is `claimed`. PT10S to PT24H
            (allocation.max_claim_ttl). Needs `claim:create`.
          examples: [PT10M]
        publish: { type: boolean, default: false, description: "Only with `claim_ttl`. The claim makes its DNS records and DHCP reservation." }
        status: { type: string, enum: [allocated, reserved], default: allocated, description: "Must not be combined with `claim_ttl` (422)." }
        external_ref: { type: string, description: "Durable natural key, unique per source. An existing address with this ref is adopted (200).", examples: ["k8s:kestrel-mgmt:ipaddressclaim/capi-kestrel/kestrel-k8s-cp-0-eth0"] }
        owner: { type: string, description: Team name. }
        description: { type: string }
        tags: { $ref: "#/components/schemas/Tags" }
        attributes: { type: object, additionalProperties: true }
    AllocateAddress:
      allOf:
        - $ref: "#/components/schemas/AllocateOptions"
        - type: object
          properties:
            address: { type: string, format: ip, description: "Take this address. If it is taken: 409 `address.conflict`." }
            hint: { type: string, format: ip, description: "With `strategy: hint`.", examples: [10.110.1.11] }
            fqdn: { type: string, examples: [cn-622.kestrel.example.org] }
    BatchAllocateAddresses:
      allOf:
        - $ref: "#/components/schemas/AllocateOptions"
        - type: object
          required: [count]
          properties:
            count: { type: integer, minimum: 1, maximum: 256 }
            contiguous: { type: boolean, default: false }
            fqdns: { type: array, items: { type: string }, description: "One FQDN per address. The length equals `count`." }
    Host:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [name, host_kind]
          properties:
            name: { type: string, description: Primary FQDN., examples: [cn-004.kestrel.example.org] }
            host_kind: { type: string, enum: [physical, vm, hypervisor, appliance, container-node] }
            role: { type: string, examples: [compute] }
            platform: { type: [string, "null"], enum: [libvirt, openstack, other, null] }
            runs_on: { type: [string, "null"], description: Host name of the hypervisor. }
            asset_link: { type: [string, "null"], description: FNT device ELID., readOnly: true }
            interfaces:
              type: array
              readOnly: true
              items: { $ref: "#/components/schemas/Interface" }
    Interface:
      type: object
      required: [name]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        host_id: { type: string, format: uuid }
        name: { type: string, examples: [eno1, ib0, bmc] }
        mac: { type: [string, "null"], examples: ["3c:ec:ef:12:0a:44"] }
        port_guid: { type: [string, "null"], description: "InfiniBand port GUID: 16 lowercase hex digits without `0x`. Colons and `0x` are accepted and normalised. Only the OpenSM export writes `0x`.", examples: ["0c42a1030071a2b4"] }
        node_guid: { type: [string, "null"], description: "InfiniBand node GUID, same notation.", examples: ["0c42a1030071a2b0"] }
        fabric: { type: [string, "null"], examples: [kestrel-ib] }
        partitions:
          type: array
          items:
            type: object
            properties:
              name: { type: string, examples: [kestrel-ipoib] }
              pkey: { type: string, pattern: "^0x[0-9a-f]{4}$", examples: ["0x0001"] }
              membership: { type: string, enum: [full, limited] }
        lid: { type: [integer, "null"], readOnly: true, description: Observed from the subnet manager., examples: [41] }
        lid_observed_at: { type: [string, "null"], format: date-time, readOnly: true }
        port_id: { type: [string, "null"], format: uuid }
        addresses:
          type: array
          readOnly: true
          items: { type: string }
    Zone:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [name]
          properties:
            name: { type: string, examples: [kestrel.example.org] }
            zone_kind: { type: string, enum: [forward, reverse] }
            views: { type: array, items: { type: string }, examples: [[internal, external]] }
            share_view: { type: boolean, description: One zone body for all its views. }
            serial: { type: integer, format: int64, readOnly: true }
            default_ttl: { type: integer, minimum: 60, examples: [3600] }
            soa:
              type: object
              properties:
                mname: { type: string, examples: [ns1.example.org] }
                rname: { type: string, examples: [hostmaster.example.org] }
                refresh: { type: integer }
                retry: { type: integer }
                expire: { type: integer }
                minimum: { type: integer }
            extra_records: { type: string, description: "Zone-file text that bembel adds as is, after a check." }
            servers:
              type: array
              items:
                type: object
                required: [server, role]
                properties:
                  server: { type: string, examples: [ns1.example.org] }
                  role: { type: string, enum: [primary, secondary, forward] }
    View:
      type: object
      required: [name]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, examples: [internal, external] }
        transfer_key: { type: string, description: "TSIG key for zone transfers in this view. Default `xfer-<view name>`.", examples: [xfer-internal] }
        recursion: { type: boolean, default: false }
    Record:
      type: object
      required: [name, type, data]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        zone_id: { type: string, format: uuid, readOnly: true }
        name: { type: string, examples: [login] }
        type: { type: string, enum: [A, AAAA, CNAME, MX, TXT, SRV, NS, CAA, PTR, SSHFP, TLSA] }
        ttl: { type: [integer, "null"], minimum: 60, maximum: 604800, description: Null means the default TTL of the zone., examples: [300] }
        data: { type: string, examples: [cn-004.kestrel.example.org.] }
        view: { type: [array, "null"], items: { type: string }, description: Null means all views of the zone., examples: [[internal]] }
        derived: { type: boolean, readOnly: true, description: Made from an address. Not editable. }
        revision: { type: integer, format: int64, readOnly: true }
    DhcpScope:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          properties:
            prefix_id: { type: string, format: uuid, description: The subnet of the scope. }
            cidr: { type: string, readOnly: true, examples: [10.20.4.0/22] }
            vrf: { type: string, readOnly: true, description: The VRF of the subnet., examples: [global] }
            enabled: { type: boolean }
            servers: { type: array, items: { type: string }, examples: [[dhcp1.example.org, dhcp2.example.org]] }
            failover_pair: { type: [string, "null"], examples: [dhcp-a] }
            shared_network: { type: [string, "null"], examples: [ib-kestrel-ipoib] }
            reachability:
              type: string
              enum: [relay, attached]
              default: relay
              description: "relay: the gateway relays (ip helper). attached: a DHCP server has an interface in the subnet."
            routers:
              oneOf:
                - { type: array, items: { type: string } }
                - { type: string, const: none }
              examples: [[10.20.4.1], none]
            default_lease_time: { type: [integer, "null"], description: Seconds. Null inherits from the server or global level., examples: [28800] }
            max_lease_time: { type: [integer, "null"], description: Seconds. Null inherits., examples: [86400] }
            options:
              type: array
              items:
                type: object
                properties:
                  name: { type: string, examples: [domain-name-servers] }
                  value:
                    oneOf:
                      - { type: string }
                      - { type: array, items: { type: string } }
                    examples: [[10.20.2.53, 10.20.2.54]]
            pools:
              type: array
              readOnly: true
              items:
                type: object
                properties:
                  first: { type: string }
                  last: { type: string }
    DhcpServer:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [name]
          properties:
            name: { type: string, examples: [dhcp1.example.org] }
            failover_pair: { type: [string, "null"], examples: [dhcp-a] }
            attached_interfaces:
              type: array
              description: Interfaces of the server inside a subnet, for scopes with `reachability` attached.
              items:
                type: object
                properties:
                  interface: { type: string, examples: [ib0.8001] }
                  prefix: { type: string, format: cidr, examples: [10.100.0.0/16] }
                  partition: { type: [string, "null"], pattern: "^0x[0-9a-f]{4}$", examples: ["0x0001"] }
                  address: { type: string, format: ip, examples: [10.100.0.67] }
    LeaseObservation:
      type: object
      required: [address, source, kind, observed_at]
      properties:
        address: { type: string, format: ip }
        mac: { type: [string, "null"] }
        client_id: { type: [string, "null"], examples: ["ff:00:00:00:00:00:02:00:00:02:c9:00:0c:42:a1:03:00:71:a2:b4"] }
        hostname: { type: [string, "null"] }
        state: { type: [string, "null"], examples: [active, expired, free] }
        starts: { type: [string, "null"], format: date-time }
        ends: { type: [string, "null"], format: date-time }
        observed_at: { type: string, format: date-time }
        source: { type: string, enum: [lease, log] }
        kind: { type: string, enum: [lease, ack, unmatched] }
    Deployment:
      type: object
      required: [bundle, result]
      properties:
        bundle: { type: string, examples: [b-7c41e0] }
        at: { type: string, format: date-time }
        result: { type: string, enum: [ok, failed, rejected] }
        reason: { type: [string, "null"], description: "For a rejected bundle: signature, identity, rollback or hash." }
        zones:
          type: array
          items:
            type: object
            properties:
              zone: { type: string, examples: [kestrel.example.org] }
              view: { type: string, examples: [internal] }
              result: { type: string, enum: [ok, failed] }
              served_serial: { type: integer, format: int64, examples: [1793815061] }
    Export:
      type: object
      properties:
        id: { type: string, format: uuid }
        target: { type: string, enum: [bind, dhcpd, opensm, prefix-list, address-group] }
        name: { type: string, examples: [ns1.example.org, campus-bgp] }
        format: { type: string, examples: [zone-files, dhcpd.conf, frr] }
        state: { type: string, enum: [idle, building, ok, failed, stale] }
        etag: { type: string }
        last_success_at: { type: [string, "null"], format: date-time, description: "The last good build, or the last scheduled check that found no change." }
        last_error: { type: [string, "null"] }
    Role:
      type: object
      properties:
        name: { type: string, examples: [allocator] }
        builtin: { type: boolean, readOnly: true }
        description: { type: string }
        permissions: { type: array, items: { type: string }, examples: [["prefix:read", "address:allocate"]] }
    ScopeTerm:
      type: object
      description: One scope term. A binding ANDs its terms.
      required: [type]
      properties:
        type: { type: string, enum: [global, vrf, prefix, zone, site, team, tag] }
        value: { type: string, description: "For a tag term: `key=value`, or a bare key for any value.", examples: ["hpc-fabric", "10.20.0.0/16", "example.org", "hpc-ops", "role=login"] }
        vrf: { type: string, description: VRF name for a prefix term in a VRF other than global. }
    BindingInput:
      type: object
      required: [subject, role, scope]
      properties:
        subject: { type: string, description: Subject key., examples: ["kc:hpc-ops", "k8s:prod-1:capi-system:capi-ipam"] }
        role: { type: string }
        scope:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ScopeTerm" }
        expires_at: { type: [string, "null"], format: date-time }
        reason: { type: string }
    Binding:
      allOf:
        - $ref: "#/components/schemas/BindingInput"
        - type: object
          properties:
            id: { type: string, format: uuid, readOnly: true }
            created_at: { type: string, format: date-time, readOnly: true }
            created_by: { type: string, readOnly: true }
            suspended_at: { type: [string, "null"], format: date-time, readOnly: true, description: "Set when a role change makes the binding exceed the grants of its creator. A suspended binding grants nothing." }
            revision: { type: integer, format: int64, readOnly: true }
    Grant:
      type: object
      properties:
        binding_id: { type: string, format: uuid }
        via: { type: string, description: Subject that carries the binding., examples: ["kc:hpc-ops"] }
        role: { type: string }
        scope: { type: array, items: { $ref: "#/components/schemas/ScopeTerm" } }
        permissions: { type: array, items: { type: string } }
    Me:
      type: object
      properties:
        subject: { type: string, examples: ["kc:a.berger"] }
        kind: { type: string, enum: [user, service] }
        issuer: { type: string, examples: ["https://id.example.org/realms/main"] }
        display_name: { type: string }
        groups: { type: array, items: { type: string }, examples: [["kc:hpc-ops"]] }
        token_kind: { type: string, enum: [session, oidc, pat] }
        token_expires_at: { type: string, format: date-time }
    ChangeRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string, readOnly: true, examples: [cr-0042] }
        state: { type: string, enum: [pending, approved, executed, failed, rejected, withdrawn, expired] }
        rule: { type: string, enum: [prefix.delete-with-children, zone.delete, bulk.threshold, binding.privileged, role.privileged, dhcp.restart-override] }
        action: { type: string, examples: [prefix:delete] }
        resource: { type: string, examples: ["prefix/10.20.16.0/22"] }
        reason: { type: string }
        proposer: { type: string, examples: ["kc:a.berger"] }
        approver: { type: [string, "null"] }
        failure_code: { type: [string, "null"], examples: [change-request.stale, change-request.proposer-forbidden] }
        impact: { type: object, additionalProperties: true, description: "Counts that the approver sees, for example {prefixes: 4, addresses: 0}." }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    Comment:
      type: object
      required: [text]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        author: { type: string, readOnly: true, examples: ["kc:m.huber"] }
        text: { type: string, minLength: 1, maxLength: 4000 }
        created_at: { type: string, format: date-time, readOnly: true }
    AuditEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        ts: { type: string, format: date-time }
        request_id: { type: string }
        actor: { type: string, examples: ["kc:a.berger", "system:reaper"] }
        on_behalf_of: { type: [string, "null"] }
        token_kind: { type: string }
        origin: { type: string, enum: [ui, cli, api, assistant, agent, sync, system] }
        action: { type: string, examples: [address:allocate] }
        resource_kind: { type: string }
        resource_id: { type: [string, "null"], format: uuid }
        decision: { type: string, enum: [allow, deny, pending] }
        via: { type: string, enum: [binding, self, system], description: "binding: a binding gave the right. self: an implicit right on own drafts, tokens and requests. system: a built-in worker." }
        via_binding_id: { type: [string, "null"], format: uuid, description: Set only when `via` is binding. }
        change_request_id: { type: [string, "null"], format: uuid }
        before: { type: [object, "null"] }
        after: { type: [object, "null"] }
    Page:
      type: object
      required: [items]
      properties:
        items: { type: array, items: {} }
        next_page_token:
          type: [string, "null"]
          description: Null on the last page.
    RolePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Role" } } } }
    BindingPage:
      allOf:
