    Token:
      type: object
      required: [name, expires_at]
      properties:
        id: { type: string, readOnly: true, examples: [8Kd2mQvX] }
        name: { type: string }
        token: { type: string, readOnly: true, description: Shown once. }
        expires_at: { type: string, format: date-time }
        permissions: { type: array, items: { type: string } }
        scope: { type: array, items: { $ref: "#/components/schemas/ScopeTerm" } }
        last_used_at: { type: [string, "null"], format: date-time, readOnly: true }
    Webhook:
      type: object
      required: [url, types]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        url: { type: string, format: uri }
        types: { type: array, items: { type: string }, examples: [["org.example.bembel.address.*"]] }
        secret: { type: string, readOnly: true, description: "HMAC key, `whsec_...`. Shown once." }
        enabled: { type: boolean }
        last_delivery_state: { type: string, readOnly: true, enum: [ok, retrying, failed] }
    Problem:
      type: object
      description: RFC 9457 problem details with bembel members.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, examples: ["urn:bembel:problem:prefix.exhausted"] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: Same as the end of `type`., examples: [prefix.exhausted] }
        request_id: { type: string }
        required_permission: { type: string, examples: ["prefix:allocate"] }
        errors:
          type: array
          items:
            type: object
            properties:
              pointer: { type: string, examples: ["/length"] }
              detail: { type: string }
    Event:
      type: object
      description: CloudEvents 1.0, JSON format.
      required: [specversion, id, source, type]
      properties:
        specversion: { type: string, const: "1.0" }
        id: { type: string }
        source: { type: string, examples: ["https://bembel.example.org"] }
        type: { type: string, examples: [org.example.bembel.address.allocated] }
        subject: { type: string, examples: ["/v1/addresses/0197c3a2-5b7e-7c1d-9a40-3f6e2d81b5c4"] }
        time: { type: string, format: date-time }
        datacontenttype: { type: string, const: application/json }
        bembelseq: { type: integer, format: int64, description: Gap-free order number. }
        actor: { type: string }
        data: { type: object, additionalProperties: true }
